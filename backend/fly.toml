# fly.toml app configuration file generated for backend-muddy-moon-310 on 2025-09-25T10:03:51+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-muddy-moon-310'
primary_region = 'bom'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

# Add this new section at the end
[processes]
  app = "uvicorn server:app --host 0.0.0.0 --port 8080"