app = 'backend-muddy-moon-310'
primary_region = 'bom'
swap_size_mb = 1024

[build]

# The Modern "Production" Service Block
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false # Keeps server warm for fast response
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Production Safety: Check /health every 15s to ensure app is alive
  [[http_service.checks]]
    grace_period = "500s"
    interval = "15s"
    method = "GET"
    timeout = "2s"
    path = "/health"

  # Edge Configuration: Handles CORS before it even hits your Python code
  [http_service.http_options.response.headers]
    Access-Control-Allow-Origin = "https://0pirate.com"
    Access-Control-Allow-Methods = "DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT"
    Access-Control-Allow-Headers = "content-type, authorization"
    Access-Control-Allow-Credentials = "true"
    Access-Control-Max-Age = "600"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

